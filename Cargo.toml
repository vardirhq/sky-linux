[workspace]
resolver = "2"
members = ["crates/sky-core", "crates/sky-daemon", "apps/desktop/src-tauri"]
default-members = ["crates/sky-core", "crates/sky-daemon", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/vardirhq/sky-linux"
rust-version = "1.80"

[workspace.dependencies]
sky-core = { path = "crates/sky-core" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
notify = "8"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
