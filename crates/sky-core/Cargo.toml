[package]
name = "sky-core"
description = "Sky Core: application engine for Sky Linux (accounts, transfers, backups, persistence, IPC)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["keyring"]
# Store secrets in the Linux Secret Service (GNOME Keyring, KWallet, KeePassXC).
keyring = ["dep:keyring"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
dirs.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
notify.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
libc = "0.2"
keyring = { version = "3", optional = true, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
chrono.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
dirs.workspace = true
